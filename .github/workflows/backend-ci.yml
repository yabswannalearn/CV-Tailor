name: Backend CI

on:
  push:
    branches:
      - main
      - deployment
  pull_request:
    branches:
      - main

jobs:
  backend-smoke-test:
    name: Backend smoke test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cv_tailor
      GEMINI_API_KEY: ci-placeholder
      SESSION_SECRET: ci-session-secret
      FRONTEND_ORIGINS: http://localhost:3000
      ENVIRONMENT: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ai-service/.python-version
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import FastAPI app
        run: |
          python -B -c "import main; print('app import ok')"

      - name: Check health endpoint
        run: |
          python -B -c "from fastapi.testclient import TestClient; from main import app; response = TestClient(app).get('/health'); assert response.status_code == 200; assert response.json() == {'status': 'ok'}; print('health ok')"
